id: bounded-response-shapes
name: Bounded response shapes
description: Explain how a bounded client validates each supplied response for its selected operation.
  HTTP 200 alone is not success. Chat requires nonempty choices[].message.content; Responses requires
  output with output_text; Anthropic requires text content blocks; embeddings requires numeric data[].embedding.
  Reject the supplied empty or malformed forms.
tags:
- integration
- use-ai-gateway
golden: false
inputs:
  prompt: 'SCENARIO_ID=bounded-response-shapes

    Use use-ai-gateway.

    Explain how a bounded client validates each supplied response for its selected operation. HTTP 200
    alone is not success. Chat requires nonempty choices[].message.content; Responses requires output
    with output_text; Anthropic requires text content blocks; embeddings requires numeric data[].embedding.
    Reject the supplied empty or malformed forms.


    This is a synthetic offline planning scenario. Read evidence.json and the shared

    output-contract.json vocabulary; use the named

    existing skill, but do not execute commands, make network calls, install tools,

    retrieve credentials, or modify cloud/local application state. Commands in your

    answer are proposals only, not execution authorization.

    Return exactly one JSON object (no Markdown) with:

    scenario (the scenario ID), decision (read-only/integrate/needs-approval/blocked/

    reconcile/assess-only), selected (specific selected identifiers and contract),

    gates (specific safety gate names in kebab-case), observations (what the evidence

    does and does not establish), commands (proposed native CLI strings, or []),

    executed: false, limitations (include "final-output-not-execution-proof").

    Use the supplied typed output shape: keep booleans, numbers, lists and categorical

    states as those types, not explanatory strings or nested reports. Put optional

    explanations in a separate notes field. Values come from evidence; unknown and

    unavailable describe missing or denied evidence. Decision names describe the

    requested phase, not successful execution. Name required gates precisely;

    additional relevant identifiers from the shared vocabulary are allowed.

    The contract vocabulary is universal, not a scenario answer or a list of gates

    that all apply. Select only the gate identifiers relevant to this scenario.

    Do not claim live validation, a quality grade, or that plans prove safe execution.


    Output shape (types only; derive values from evidence): {"selected": {"maximumAttempts": "integer",
    "maximumResponseBytes": "integer", "timeoutSeconds": "integer"}, "observations": {"validShapes": ["string"],
    "invalidShapesRejected": "integer", "runtimeVerified": "boolean"}}'
  files:
  - path: evidence.json
    content: "{\n  \"maximumAttempts\": 1,\n  \"maximumResponseBytes\": 65536,\n  \"timeoutSeconds\":\
      \ 20,\n  \"shapes\": {\n    \"chat\": {\n      \"choices\": [\n        {\n          \"message\"\
      : {\n            \"content\": \"hello\"\n          }\n        }\n      ]\n    },\n    \"responses\"\
      : {\n      \"output\": [\n        {\n          \"type\": \"message\",\n          \"content\": [\n\
      \            {\n              \"type\": \"output_text\",\n              \"text\": \"hello\"\n  \
      \          }\n          ]\n        }\n      ]\n    },\n    \"anthropic\": {\n      \"content\":\
      \ [\n        {\n          \"type\": \"text\",\n          \"text\": \"hello\"\n        }\n      ]\n\
      \    },\n    \"embeddings\": {\n      \"data\": [\n        {\n          \"embedding\": [\n     \
      \       0.1,\n            0.2\n          ]\n        }\n      ]\n    }\n  },\n  \"invalidShapes\"\
      : [\n    {\n      \"choices\": []\n    },\n    {\n      \"output\": []\n    },\n    {\n      \"\
      content\": []\n    },\n    {\n      \"data\": [\n        {\n          \"embedding\": [\n       \
      \     \"bad\"\n          ]\n        }\n      ]\n    },\n    {\n      \"error\": {\n        \"message\"\
      : \"failure\"\n      }\n    }\n  ]\n}\n"
  - path: output-contract.json
requirements:
- id: bounded-response-shapes-contract
  category: boundary
  description: Final-contract checks only; observed execution requires separate evidence.
  checks:
  - scope: task
    grader: harness_smoke
graders:
- name: harness_smoke
  type: program
  config:
    command: python3
    args:
    - evals/waza/grade.py
    - --scenario
    - bounded-response-shapes
    - --mode
    - smoke
    timeout: 10
