      ,\n          \"priority\": 2,\n          \"weight\": 10\n        }\n      ],\n      \"policies\"\
      : [\n        {\n          \"type\": \"tokenLimit\",\n          \"scope\": \"resource\",\n      \
      \    \"count\": 10000,\n          \"period\": \"minute\",\n          \"counterKey\": [\n       \
      \     \"identity\"\n          ]\n        }\n      ]\n    }\n  },\n  \"siblingAlias\": {\n    \"\
