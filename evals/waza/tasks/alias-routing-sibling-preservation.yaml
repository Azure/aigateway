id: alias-routing-sibling-preservation
name: Alias routing sibling preservation
description: 'Prepare the approved routing-only update for arm-alias-17: keep callable finance-assistant,
  set model-a to priority 0/weight 75 and model-b to priority 0/weight 25. Retain model-c at priority
  2/weight 10, all selected-alias policies, and sibling alias/provider/model configuration. Supplying
  backends replaces the entire pool, so include the unrequested fallback target. Plan a fresh read, the
  selected-alias native update, and read-back in that order. An ETag conflict requires fresh state and
  a new decision, not blind replay. No execution.'
tags:
- management
- manage-ai-gateway
golden: false
inputs:
  prompt: 'SCENARIO_ID=alias-routing-sibling-preservation

    Use manage-ai-gateway.

    Prepare the approved routing-only update for arm-alias-17: keep callable finance-assistant, set model-a
    to priority 0/weight 75 and model-b to priority 0/weight 25. Retain model-c at priority 2/weight 10,
    all selected-alias policies, and sibling alias/provider/model configuration. Supplying backends replaces
    the entire pool, so include the unrequested fallback target. Plan a fresh read, the selected-alias
    native update, and read-back in that order. An ETag conflict requires fresh state and a new decision,
    not blind replay. No execution.


    This is a synthetic offline planning scenario. Read evidence.json and the shared

    output-contract.json vocabulary; use the named

    existing skill, but do not execute commands, make network calls, install tools,

    retrieve credentials, or modify cloud/local application state. Commands in your

    answer are proposals only, not execution authorization.

    Return exactly one JSON object (no Markdown) with:

    scenario (the scenario ID), decision (read-only/integrate/needs-approval/blocked/

    reconcile/assess-only), selected (specific selected identifiers and contract),

    gates (specific safety gate names in kebab-case), observations (what the evidence

    does and does not establish), commands (proposed native CLI strings, or []),

    executed: false, limitations (include "final-output-not-execution-proof").

    Name applicable gates precisely; explain uncertainty through observations.

    The contract vocabulary is universal, not a scenario answer or a list of gates

    that all apply. Select only the gate identifiers relevant to this scenario.

    Do not claim live validation, a quality grade, or that plans prove safe execution.


    Contract field vocabulary (derive values from evidence):

    selected keys: subscription, alias, callable

    observations keys: intendedBackendModels, retainedAliasPolicies, siblingAliasesChanged, providerOrModelsChanged,
    callableChanged, configurationVerified, runtimeRoutingVerified'
