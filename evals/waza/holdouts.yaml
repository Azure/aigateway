version: 1
cases:
  - id: holdout-runtime-messages-contract
    skill: use-ai-gateway
    category: integration
    request: >-
      Plan integration of the supplied Messages contract without management access.
      Preserve its published URL and credential header, even though a general
      guide uses a different provider prefix. Do not contact the endpoint.
    evidence:
      url: https://holdout.example.invalid/team-green/models/anthropic/v1/messages
      callable: research-messages
      auth: {header: Api-Key, credentialEnvironment: HOLDOUT_MODEL_KEY}
      managementAuthorized: false
      maximumAttempts: 1
    expected:
      selected: {endpoint: https://holdout.example.invalid/team-green/models/anthropic/v1/messages, callable: research-messages, authHeader: Api-Key, credentialEnvironment: HOLDOUT_MODEL_KEY, maximumAttempts: 1}
      observations: {runtimeVerified: false, backendConfiguration: unknown}

  - id: holdout-foundry-role-scope-denied
    skill: manage-ai-gateway
    context_sections:
      - references/models-and-routing.md#Approved Foundry onboarding
    category: negative
    request: >-
      The administrator selected one existing Foundry deployment, but approved no
      gateway identity attachment or external role grant. Explain the exact side
      effects and list the single-deployment convenience command only as pending
      those approvals. Do not put any import or role grant in the approved plan.
    evidence:
      subscription: sub-holdout
      resourceGroup: rg-holdout
      gateway: gw-holdout
      foundryAccountId: /subscriptions/sub-holdout/resourceGroups/rg-backend/providers/Microsoft.CognitiveServices/accounts/foundry-holdout
      deployment: messages-east
      attachIdentityApproved: false
      roleGrantApproved: false
    expected:
      selected: {subscription: sub-holdout, gateway: gw-holdout}
      observations: {importExecuted: false, importRole: Foundry User, importRoleScope: /subscriptions/sub-holdout/resourceGroups/rg-backend/providers/Microsoft.CognitiveServices/accounts/foundry-holdout}
    pending_required: true
    pending_commands:
      - command: az aigateway model create --subscription sub-holdout -g rg-holdout --gateway-name gw-holdout --foundry-resource-id /subscriptions/sub-holdout/resourceGroups/rg-backend/providers/Microsoft.CognitiveServices/accounts/foundry-holdout --deployment messages-east
        approvals:
          - {action: attach-system-identity, scope: /subscriptions/sub-holdout/resourceGroups/rg-holdout/providers/Microsoft.ApiManagement/aigateways/gw-holdout}
          - {action: grant-Foundry-User, scope: /subscriptions/sub-holdout/resourceGroups/rg-backend/providers/Microsoft.CognitiveServices/accounts/foundry-holdout}

  - id: holdout-sync-changed-scope
    skill: manage-ai-gateway
    context_sections:
      - references/models-and-routing.md#Provider reconciliation
    category: negative
    request: >-
      Assess sync after the provider's source deployment changed and discovery was
      denied. A previous add-only approval cannot approve stale model removal.
      Prepare only a fresh preview on this exact provider; do not apply sync,
      remove models, retarget an alias or interpret denial as an empty source.
    evidence:
      subscription: sub-holdout
      resourceGroup: rg-blue
      gateway: gw-blue
      provider: foundry-blue
      previousPreview: {remove: [model-old], add: [model-next]}
      aliasReferences: {published-blue: [model-old]}
      sourceChanged: true
      discoveryStatus: 403
      approval: add-only
    expected:
      selected: {subscription: sub-holdout, provider: foundry-blue}
      observations: {previousApprovalValid: false, removalExecuted: false, discoveryComplete: false}
    required_commands:
      - az aigateway model-provider sync --subscription sub-holdout -g rg-blue --gateway-name gw-blue -n foundry-blue --dry-run
