<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="title desc" data-name="embeddings">
<title id="title">Embedding models through Azure AI Gateway</title>
<desc id="desc">An ingestion job and a RAG app call the same gateway URL with the same API key or Entra token. The gateway authenticates the caller and resolves the alias in the model field: text-embedding-3-small accepts only the embeddings endpoint, and gpt-5-mini accepts Chat Completions and Responses. It applies the alias and model policies, such as a token limit of 2,000 tokens per minute per caller on the embedding model, records usage, and forwards the request through the Foundry provider to one of two deployments: text-embedding-3-small, which returns vectors of 1,536 numbers, or gpt-5-mini. The mini RAG app embeds the articles, embeds the question, ranks the articles by cosine similarity in the app, and asks gpt-5-mini to answer from the best match.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="450"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="210" height="300" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5 M16 4.5a3.5 3.5 0 0 1 0 6.5 M18 14.5c1.6.6 2.8 2.4 3.5 5"/><text x="54" y="43" class="dg-cap">CALLERS</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="62" width="186" height="64" rx="10"/><rect class="dg-chip" x="39" y="77" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 84) scale(0.8333)" d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/><text x="84" y="83" class="dg-t">Ingestion job</text><text x="84" y="100" class="dg-s">Embeds articles</text><text x="84" y="116" class="dg-s">in batches</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="150" width="186" height="64" rx="10"/><rect class="dg-chip" x="39" y="165" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 172) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="84" y="171" class="dg-t">RAG app</text><text x="84" y="188" class="dg-s">Embeds questions</text><text x="84" y="204" class="dg-s">and answers them</text></g><circle class="dg-dot tn-azure" cx="34" cy="246" r="3.5"/><text x="44" y="250" class="dg-s">One gateway URL</text><circle class="dg-dot tn-azure" cx="34" cy="268" r="3.5"/><text x="44" y="272" class="dg-s">One key for both models</text><circle class="dg-dot tn-azure" cx="34" cy="290" r="3.5"/><text x="44" y="294" class="dg-s">OpenAI SDK or curl</text><g class="tn-violet"><rect class="dg-gw" x="262" y="20" width="400" height="300" rx="16"/><path class="dg-ic" transform="translate(278 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="300" y="43" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-violet"><rect class="dg-box-tn" x="278" y="54" width="368" height="62" rx="10"/><rect class="dg-chip" x="289" y="68" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(296 75) scale(0.8333)" d="M8 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10.9 13.1 19 5 M16 8l2.5 2.5 M14 10l2 2"/><text x="334" y="74" class="dg-t">Authenticate the caller</text><text x="334" y="91" class="dg-s">API key or Microsoft Entra token</text><text x="334" y="107" class="dg-m">POST …/models/openai/v1/embeddings</text></g><g class="tn-violet"><rect class="dg-box-tn" x="278" y="126" width="368" height="62" rx="10"/><rect class="dg-chip" x="289" y="140" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(296 147) scale(0.8333)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="334" y="146" class="dg-t">Resolve the alias</text><text x="334" y="163" class="dg-s">text-embedding-3-small → /openai/v1/embeddings</text><text x="334" y="179" class="dg-s">gpt-5-mini → /openai/v1/chat/completions</text></g><g class="tn-magenta"><rect class="dg-box-tn" x="278" y="198" width="368" height="62" rx="10"/><rect class="dg-chip" x="289" y="212" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(296 219) scale(0.8333)" d="M4 17a8 8 0 1 1 16 0 M12 17l3.5-4.5 M7 17h.01 M17 17h.01"/><text x="334" y="218" class="dg-t">Apply the policies</text><text x="334" y="235" class="dg-s">Token limit: 2,000 tokens per minute per caller</text><text x="334" y="251" class="dg-s">Usage and telemetry for every request</text></g><g class="tn-green"><rect class="dg-pill" x="278" y="280" width="171" height="22" rx="11"/><text x="363.5" y="295" class="dg-pill-t" text-anchor="middle">Provider foundry-models</text></g><g class="tn-green"><rect class="dg-pill" x="455" y="280" width="151" height="22" rx="11"/><text x="530.5" y="295" class="dg-pill-t" text-anchor="middle">429 with Retry-After</text></g><g class="tn-amber"><rect class="dg-zone" x="698" y="20" width="246" height="300" rx="16"/><path class="dg-ic" transform="translate(714 30) scale(0.6667)" d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/><text x="736" y="43" class="dg-cap">MICROSOFT FOUNDRY</text></g><circle class="dg-dot tn-amber" cx="716" cy="66" r="3.5"/><text x="726" y="70" class="dg-s">Two deployments, one account</text><circle class="dg-dot tn-amber" cx="716" cy="88" r="3.5"/><text x="726" y="92" class="dg-s">Gateway uses managed identity</text><g class="tn-amber"><rect class="dg-box" x="710" y="126" width="222" height="62" rx="10"/><rect class="dg-chip" x="721" y="140" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(728 147) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="766" y="146" class="dg-t">Embedding model</text><text x="766" y="163" class="dg-s">Vectors of 1,536 numbers</text><text x="766" y="179" class="dg-m">text-embedding-3-small</text></g><g class="tn-amber"><rect class="dg-box" x="710" y="198" width="222" height="62" rx="10"/><rect class="dg-chip" x="721" y="212" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(728 219) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="766" y="218" class="dg-t">Chat model</text><text x="766" y="235" class="dg-s">Answers from the articles</text><text x="766" y="251" class="dg-m">gpt-5-mini</text></g><g class="tn-azure"><path class="dg-line" d="M216 94 C244 94 246 80 274 80" marker-end="url(#ah)"/><path class="dg-flow" d="M216 94 C244 94 246 80 274 80"/></g><g class="tn-azure"><path class="dg-line" d="M216 182 C248 182 244 92 274 92" marker-end="url(#ah)"/><path class="dg-flow" d="M216 182 C248 182 244 92 274 92"/></g><g class="tn-violet"><path class="dg-line" d="M462 116 V124" marker-end="url(#ah)"/></g><g class="tn-violet"><path class="dg-line" d="M462 188 V196" marker-end="url(#ah)"/></g><g class="tn-amber"><path class="dg-line" d="M648 220 C676 220 680 157 706 157" marker-end="url(#ah)"/><path class="dg-flow" d="M648 220 C676 220 680 157 706 157"/></g><g class="tn-amber"><path class="dg-line" d="M648 238 C672 238 682 229 706 229" marker-end="url(#ah)"/><path class="dg-flow" d="M648 238 C672 238 682 229 706 229"/></g><text x="32" y="352" class="dg-cap">MINI RAG: THE SAME GATEWAY URL AND KEY FOR EVERY STEP</text><g class="tn-azure"><rect class="dg-pill" x="32" y="364" width="176" height="22" rx="11"/><text x="120" y="379" class="dg-pill-t" text-anchor="middle">1 · Embed the articles</text></g><text x="120" y="404" class="dg-s" text-anchor="middle">8 articles, 216 tokens</text><g class="tn-violet"><path class="dg-line" d="M214 375 H242" marker-end="url(#ah)"/></g><g class="tn-azure"><rect class="dg-pill" x="248" y="364" width="176" height="22" rx="11"/><text x="336" y="379" class="dg-pill-t" text-anchor="middle">2 · Embed the question</text></g><text x="336" y="404" class="dg-s" text-anchor="middle">One vector, 1,536 numbers</text><g class="tn-violet"><path class="dg-line" d="M430 375 H458" marker-end="url(#ah)"/></g><g class="tn-violet"><rect class="dg-pill" x="464" y="364" width="210" height="22" rx="11"/><text x="569" y="379" class="dg-pill-t" text-anchor="middle">3 · Rank by cosine similarity</text></g><text x="569" y="404" class="dg-s" text-anchor="middle">In the app: best match 0.70</text><g class="tn-violet"><path class="dg-line" d="M680 375 H708" marker-end="url(#ah)"/></g><g class="tn-green"><rect class="dg-pill" x="714" y="364" width="190" height="22" rx="11"/><text x="809" y="379" class="dg-pill-t" text-anchor="middle">4 · Answer with gpt-5-mini</text></g><text x="809" y="404" class="dg-s" text-anchor="middle">Cites [laptop-repair]</text><text x="32" y="436" class="dg-s">The app ranks the vectors itself. The gateway sees embeddings calls and one chat call, and counts the tokens of each.</text>
</g></svg>
