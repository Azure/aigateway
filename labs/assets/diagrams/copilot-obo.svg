k the caller</text><text x="308" y="102" class="dg-s">Data.All scope</text><text x="308" y="118" class="dg-s">Tools User role</text></g><g class="tn-red"><rect class="dg-pill" x="262.5" y="144" width="171" height="22" rx="11"/><text x="348" y="159" class="dg-pill-t" text-anchor="middle">401 or 403 without them</text></g><g class="tn-violet"><rect class="dg-box-tn" x="460" y="60" width="208" height="72" rx="10"/><rect class="dg-chip" x="471" y="79" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(478 86) scale(0.8333)" d="M8 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10.9 13.1 19 5 M16 8l2.5 2.5 M14 10l2 2"/><text x="516" y="85" class="dg-t">Exchange the token</text><text x="516" y="102" class="dg-s">on behalf of the user</text><text x="516" y="118" class="dg-s">with managed identity</text></g><g class="tn-magenta"><path class="dg-line" d="M444 96 H456" marker-end="url(#ah)"/><path class="dg-flow" d="M444 96 H456"/></g><g class="tn-azure"><path class="dg-line" d="M208 228 C230 228 230 96 248 96" marker-end="url(#ah)"/><path class="dg-flow" d="M208 228 C230 228 230 96 248 96"/></g><rect x="238" y="185" width="55.68" height="18" rx="4" style="fill:var(--dg-bg)"/><text x="244" y="198" class="dg-s">token 1</text><g class="tn-amber"><rect class="dg-zone" x="724" y="20" width="220" height="270" rx="16"/><path class="dg-ic" transform="translate(740 30) scale(0.6667)" d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/><text x="762" y="43" class="dg-cap">AZURE CONTAINER APPS</text></g><g class="tn-amber"><rect class="dg-box" x="736" y="60" width="196" height="64" rx="10"/><rect class="dg-chip" x="747" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(754 82) scale(0.8333)" d="M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3 M12 15v2"/><text x="792" y="89" class="dg-t">Authentication</text><text x="792" y="106" class="dg-s">backend tokens only</text></g><g class="tn-red"><rect class="dg-pill" x="796.5" y="136" width="131