<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc" data-name="copilot-obo">
<title id="title">Microsoft 365 Copilot calls MCP tools through AI Gateway as the signed-in user</title>
<desc id="desc">Copilot Cowork signs the user in through a connector and sends token 1, for AI Gateway with the Data.All scope, to the obo-demo MCP server. The gateway checks the scope and the user's AI Gateway Tools User role, then exchanges the token with Microsoft Entra ID on behalf of the user. It signs in as the token exchange app with its user-assigned managed identity, whose federated credential replaces a client secret, and gets token 4, for the backend app. Container Apps authentication accepts only tokens for the backend app, and the MCP server on Azure Container Apps runs the tool for the same user.</desc>
