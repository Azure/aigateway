<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="title desc" data-name="claude-code">
<title id="title">Claude Code with models and tools from Azure AI Gateway</title>
<desc id="desc">Apps with the Anthropic SDK or REST, agents such as Foundry hosted agents and MCP clients, and coding agents such as Claude Code and GitHub Copilot call Azure AI Gateway with a Microsoft Entra ID token or a managed gateway key. The gateway handles access with Entra ID, managed keys, and RBAC; models with aliases, Foundry import, and routing; MCP with federated servers and tool allow lists; policies with token limits, cost limits, content safety, and IP filters; and observability with OpenTelemetry. It calls the claude-opus-5-5, claude-sonnet-5-5, and claude-haiku-5-5 deployments in Microsoft Foundry with its managed identity, where quota is tokens per minute per deployment, and the Microsoft Learn MCP server. The Anthropic API is an optional direct provider. The gateway exports telemetry over OTLP to Azure Monitor, and Azure Cost Management bills the Foundry models. Claude Code uses the base URL ending in /default/models/anthropic, sends the key as an Authorization bearer token, and calls the aliases named after the Foundry account and deployment.</desc>
