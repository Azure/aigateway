<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" data-name="model-failover">
<title id="title">Failover and retry across the backend models of one alias</title>
<desc id="desc">A chat app sends model: chat-failover. The alias prefers gpt-5-mini-tiny at priority 0, a deployment with a capacity of 1 that soon returns 429. A failure rule on the alias matches the 429 with the CEL condition response.status_code == 429, retries the same backend 0 times, and switches the request to the next eligible backend model, gpt-6.1-sol at priority 1, which returns 200. The rule also excludes gpt-5-mini-tiny from later requests for 30 seconds. Maximum retries per request caps the extra sends at 3, so a request makes at most four sends. Without a matching rule, the client gets the 429.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear 3}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="420"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="210" height="360" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5 M16 4.5a3.5 3.5 0 0 1 0 6.5 M18 14.5c1.6.6 2.8 2.4 3.5 5"/><text x="54" y="43" class="dg-cap">CLIENTS</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="148" width="186" height="72" rx="10"/><rect class="dg-chip" x="39" y="167" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 174) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="84" y="173" class="dg-t">Chat app</text><text x="84" y="190" class="dg-s">sends model:</text><text x="84" y="206" class="dg-m">chat-failover</text></g><text x="28" y="336" class="dg-s">The client never retries</text><text x="28" y="354" class="dg-s">and never changes the model.</text><g class="tn-violet"><rect class="dg-gw" x="252" y="20" width="344" height="360" rx="16"/><path class="dg-ic" transform="translate(268 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="290" y="43" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-violet"><rect class="dg-box-tn" x="268" y="56" width="312" height="64" rx="10"/><rect class="dg-chip" x="279" y="71" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(286 78) scale(0.8333)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="324" y="85" class="dg-t">Alias: chat-failover</text><text x="324" y="102" class="dg-s">Priority 0 first, then priority 1</text></g><text x="272" y="152" class="dg-cap">FAILURE RULES · FIRST MATCH WINS</text><g class="tn-amber"><rect class="dg-box-tn" x="268" y="164" width="312" height="76" rx="10"/><rect class="dg-chip" x="279" y="185" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(286 192) scale(0.8333)" d="M4 5h16l-6 7.5V18l-4 2v-7.5z"/><text x="324" y="191" class="dg-t">Rule 1: throttled</text><text x="324" y="208" class="dg-s">Retries 0 · exclude for 30 s</text><text x="324" y="224" class="dg-m">response.status_code == 429</text></g><g class="tn-violet"><rect class="dg-box" x="268" y="256" width="312" height="64" rx="10"/><rect class="dg-chip" x="279" y="271" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(286 278) scale(0.8333)" d="M4 17a8 8 0 1 1 16 0 M12 17l3.5-4.5 M7 17h.01 M17 17h.01"/><text x="324" y="285" class="dg-t">Maximum retries per request: 3</text><text x="324" y="302" class="dg-s">At most four sends for one request</text></g><text x="272" y="348" class="dg-s">No matching rule: the error goes to the client.</text><g class="tn-azure"><rect class="dg-zone" x="622" y="20" width="322" height="360" rx="16"/><path class="dg-ic" transform="translate(638 30) scale(0.6667)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="660" y="43" class="dg-cap">BACKEND MODELS</text></g><g class="tn-red"><rect class="dg-zone" x="634" y="52" width="298" height="150" rx="16"/><text x="650" y="75" class="dg-cap">PRIORITY 0 · PREFERRED</text></g><g class="tn-red"><rect class="dg-box-tn" x="646" y="88" width="274" height="64" rx="10"/><rect class="dg-chip" x="657" y="103" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(664 110) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="702" y="117" class="dg-t">gpt-5-mini-tiny</text><text x="702" y="134" class="dg-s">Capacity 1 · soon returns 429</text></g><g class="tn-amber"><rect class="dg-pill" x="678" y="166" width="210" height="22" rx="11"/><text x="783" y="181" class="dg-pill-t" text-anchor="middle">Excluded for 30 s after a 429</text></g><g class="tn-green"><rect class="dg-zone" x="634" y="218" width="298" height="150" rx="16"/><text x="650" y="241" class="dg-cap">PRIORITY 1 · BACKUP</text></g><g class="tn-green"><rect class="dg-box-tn" x="646" y="254" width="274" height="64" rx="10"/><rect class="dg-chip" x="657" y="269" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(664 276) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="702" y="283" class="dg-t">gpt-6.1-sol</text><text x="702" y="300" class="dg-s">Healthy · serves the request</text></g><g class="tn-green"><rect class="dg-pill" x="668" y="332" width="230" height="22" rx="11"/><text x="783" y="347" class="dg-pill-t" text-anchor="middle">200 · x-ms-served-model names it</text></g><g class="tn-azure"><path class="dg-line" d="M216 184 C240 184 242 88 264 88" marker-end="url(#ah)"/><path class="dg-flow" d="M216 184 C240 184 242 88 264 88"/></g><g class="tn-red"><path class="dg-line" d="M582 80 C610 80 614 112 642 112" marker-end="url(#ah)"/><path class="dg-flow" d="M582 80 C610 80 614 112 642 112"/></g><g class="tn-green"><path class="dg-line" d="M582 104 C616 104 610 280 642 280" marker-end="url(#ah)"/><path class="dg-flow" d="M582 104 C616 104 610 280 642 280"/></g><rect x="582.16" y="59" width="55.68" height="18" rx="4" style="fill:var(--dg-bg)"/><text x="610" y="72" class="dg-s" text-anchor="middle">1 · 429</text><rect x="572.16" y="201" width="55.68" height="18" rx="4" style="fill:var(--dg-bg)"/><text x="600" y="214" class="dg-s" text-anchor="middle">2 · 200</text><text x="16" y="404" class="dg-s">The rule turns a 429 from the primary into a 200 from the backup, and keeps the primary out for 30 seconds.</text>
</g></svg>
