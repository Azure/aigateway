<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" data-name="conditional-routing">
<title id="title">Backend conditions and session affinity on one alias</title>
<desc id="desc">Three clients call the alias chat: a research tool that sends the header x-workload: research, a chat app that sends a session-id header, and a batch job with no extra headers. For each request the gateway first keeps only the backend models whose when condition is true, then applies session affinity, priority, and weight, in the order that selectionOrder sets. gpt-6.1-sol has priority 0 and a condition on x-workload: research, so only research requests reach it. gpt-5-mini has priority 1 and no condition, so every other request falls through to it. With session affinity, requests with the same session key go to the same backend model, and weights are skipped.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="420"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="240" height="360" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5 M16 4.5a3.5 3.5 0 0 1 0 6.5 M18 14.5c1.6.6 2.8 2.4 3.5 5"/><text x="54" y="43" class="dg-cap">CLIENTS</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="60" width="216" height="64" rx="10"/><rect class="dg-chip" x="39" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 82) scale(0.8333)" d="M6 9h12v10H6z M12 9V6 M12 4.5v.01 M9.5 13.5v.01 M14.5 13.5v.01 M10 16.5h4 M4 13v2 M20 13v2"/><text x="84" y="81" class="dg-t">Research tool</text><text x="84" y="98" class="dg-m">model: chat</text><text x="84" y="114" class="dg-m">x-workload: research</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="148" width="216" height="64" rx="10"/><rect class="dg-chip" x="39" y="163" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 170) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="84" y="169" class="dg-t">Chat app</text><text x="84" y="186" class="dg-m">model: chat</text><text x="84" y="202" class="dg-m">session-id: alpha</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="236" width="216" height="64" rx="10"/><rect class="dg-chip" x="39" y="251" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 258) scale(0.8333)" d="M3.5 5h17v14h-17z M7 10l3 2-3 2 M12.5 15h4.5"/><text x="84" y="257" class="dg-t">Batch job</text><text x="84" y="274" class="dg-m">model: chat</text><text x="84" y="290" class="dg-m">no extra headers</text></g><text x="28" y="336" class="dg-s">Clients always send model: chat.</text><text x="28" y="354" class="dg-s">Headers and keys steer the request.</text><g class="tn-violet"><rect class="dg-gw" x="284" y="20" width="372" height="360" rx="16"/><path class="dg-ic" transform="translate(300 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="322" y="43" class="dg-cap-tn">AI GATEWAY · ALIAS CHAT</text></g><g class="tn-cyan"><rect class="dg-box-tn" x="300" y="56" width="340" height="56" rx="10"/><rect class="dg-chip" x="311" y="67" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(318 74) scale(0.8333)" d="M4 5h16l-6 7.5V18l-4 2v-7.5z"/><text x="356" y="73" class="dg-t">1 · Conditions</text><text x="356" y="90" class="dg-s">Keep the backend models whose when</text><text x="356" y="106" class="dg-s">expression is true for this request</text></g><g class="tn-magenta"><rect class="dg-box-tn" x="300" y="128" width="340" height="56" rx="10"/><rect class="dg-chip" x="311" y="139" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(318 146) scale(0.8333)" d="M8 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10.9 13.1 19 5 M16 8l2.5 2.5 M14 10l2 2"/><text x="356" y="145" class="dg-t">2 · Session affinity</text><text x="356" y="162" class="dg-s">The same session key goes to</text><text x="356" y="178" class="dg-s">the same backend model</text></g><g class="tn-violet"><rect class="dg-box-tn" x="300" y="200" width="340" height="56" rx="10"/><rect class="dg-chip" x="311" y="211" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(318 218) scale(0.8333)" d="M12 3l9 5-9 5-9-5z M3 12.5l9 5 9-5 M3 16.5l9 5 9-5"/><text x="356" y="225" class="dg-t">3 · Priority</text><text x="356" y="242" class="dg-s">The lowest priority number wins</text></g><g class="tn-violet"><rect class="dg-box-tn" x="300" y="272" width="340" height="56" rx="10"/><rect class="dg-chip" x="311" y="283" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(318 290) scale(0.8333)" d="M4 17a8 8 0 1 1 16 0 M12 17l3.5-4.5 M7 17h.01 M17 17h.01"/><text x="356" y="289" class="dg-t">4 · Weight</text><text x="356" y="306" class="dg-s">Splits traffic within a priority,</text><text x="356" y="322" class="dg-s">unless affinity already chose</text></g><g class="tn-cyan"><path class="dg-line" d="M470 112 V124" marker-end="url(#ah)"/></g><g class="tn-magenta"><path class="dg-line" d="M470 184 V196" marker-end="url(#ah)"/></g><g class="tn-violet"><path class="dg-line" d="M470 256 V268" marker-end="url(#ah)"/></g><g class="tn-magenta"><rect class="dg-pill" x="312.5" y="344" width="315" height="22" rx="11"/><text x="470" y="359" class="dg-pill-t" text-anchor="middle">selectionOrder sets whether 2 or 3 runs first</text></g><g class="tn-azure"><rect class="dg-zone" x="692" y="20" width="252" height="360" rx="16"/><path class="dg-ic" transform="translate(708 30) scale(0.6667)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="730" y="43" class="dg-cap">BACKEND MODELS</text></g><g class="tn-magenta"><rect class="dg-box-tn" x="704" y="92" width="228" height="76" rx="10"/><rect class="dg-chip" x="715" y="113" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(722 120) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="760" y="119" class="dg-t">gpt-6.1-sol</text><text x="760" y="136" class="dg-s">Priority 0 · condition</text><text x="760" y="152" class="dg-m">x-workload: research</text></g><g class="tn-violet"><rect class="dg-box-tn" x="704" y="232" width="228" height="76" rx="10"/><rect class="dg-chip" x="715" y="253" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(722 260) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="760" y="259" class="dg-t">gpt-5-mini</text><text x="760" y="276" class="dg-s">Priority 1</text><text x="760" y="292" class="dg-s">Always included</text></g><text x="708" y="336" class="dg-s">Research requests reach gpt-6.1-sol.</text><text x="708" y="354" class="dg-s">All other requests fall through.</text><g class="tn-azure"><path class="dg-line" d="M246 92 C272 92 274 78 296 78" marker-end="url(#ah)"/><path class="dg-flow" d="M246 92 C272 92 274 78 296 78"/></g><g class="tn-azure"><path class="dg-line" d="M246 180 C276 180 270 86 296 86" marker-end="url(#ah)"/><path class="dg-flow" d="M246 180 C276 180 270 86 296 86"/></g><g class="tn-azure"><path class="dg-line" d="M246 268 C280 268 268 94 296 94" marker-end="url(#ah)"/><path class="dg-flow" d="M246 268 C280 268 268 94 296 94"/></g><g class="tn-magenta"><path class="dg-line" d="M642 292 C676 292 672 130 700 130" marker-end="url(#ah)"/><path class="dg-flow" d="M642 292 C676 292 672 130 700 130"/></g><g class="tn-violet"><path class="dg-line" d="M642 308 C676 308 672 270 700 270" marker-end="url(#ah)"/><path class="dg-flow" d="M642 308 C676 308 672 270 700 270"/></g><text x="16" y="406" class="dg-s">Conditions decide which backend models may serve a request. Affinity, priority, and weight then pick one of them.</text>
</g></svg>
