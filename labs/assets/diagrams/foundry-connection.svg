.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear 3}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="432"/>
<g class="tn-cyan"><rect class="dg-zone" x="16" y="20" width="470" height="296" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/><text x="54" y="43" class="dg-cap">APP TEAM'S FOUNDRY PROJECT</text></g><g class="tn-cyan"><rect class="dg-box" x="28" y="56" width="200" height="64" rx="10"/><rect class="dg-chip" x="39" y="71" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 78) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="84" y="85" class="dg-t">Playground</text><text x="84" y="102" class="dg-s">Chat with the model</text></g><g class="tn-cyan"><rect class="dg-box" x="28" y="140" width="200" height="64" rx="10"/><rect class="dg-chip" x="39" y="155" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 162) scale(0.8333)" d="M6 9h12v10H6z M12 9V6 M12 4.5v.01 M9.5 13.5v.01 M14.5 13.5v.01 M10 16.5h4 M4 13v2 M20 13v2"/><text x="84" y="169" class="dg-t">Prompt agent</text><text x="84" y="186" class="dg-s">Foundry Agent Service</text></g><g class="tn-cyan"><rect class="dg-box" x="28" y="224" width="200" height="64" rx="10"/><rect class="dg-chip" x="39" y="239" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 246) scale(0.8333)" d="M6 3h8l4 4v14H6z M14 3v4h4 M10 12l-2 2 2 2 M14 12l2 2-2 2"/><text x="84" y="253" class="dg-t">Your code</text><text x="84" y="270" class="dg-s">OpenAI SDK, Responses</text></g><g class="tn-amber"><rect class="dg-box-tn" x="254" y="118" width="222" height="104" rx="10"/><rect class="dg-chip" x="265" y="153" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(272 160) scale(0.8333)" d="M9 3v5 M15 3v5 M6 8h12v3a6 6 0 0 1-12 0z M12 17v4"/><text x="310" y="159" class="dg-t">Gateway connection</text><text x="310" y="176" class="dg-s">Project managed identity</text><text x="310" y="192" class="dg-s">No deployments, no keys</text></g><g class="tn-cyan"><path class="dg-line" d="M228 88 C244 88 238 146 250 146" marker-end="url(#ah)"/><path class="dg-flow" d="M228 88 C244 88 238 146 250 146"/></g><g class="tn-cyan"><path class="dg-line" d="M228 172 H250" marker-end="url(#ah)"/><path class="dg-flow" d="M228 172 H250"/></g><g class="tn-cyan"><path class="dg-line" d="M228 256 C244 256 238 198 250 198" marker-end="url(#ah)"/><path class="dg-flow" d="M228 256 C244 256 238 198 250 198"/></g><g class="tn-violet"><rect class="dg-gw" x="510" y="20" width="262" height="296" rx="16"/><path class="dg-ic" transform="translate(526 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="548" y="43" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-violet"><rect class="dg-box-tn" x="522" y="56" width="238" height="72" rx="10"/><rect class="dg-chip" x="533" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(540 82) scale(0.8333)" d="M8 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10.9 13.1 19 5 M16 8l2.5 2.5 M14 10l2 2"/><text x="578" y="81" class="dg-t">Check the identity</text><text x="578" y="98" class="dg-s">Entra token, not a key</text><text x="578" y="114" class="dg-s">AI Gateway Models User role</text></g><g class="tn-magenta"><rect class="dg-box-tn" x="522" y="148" width="238" height="72" rx="10"/><rect class="dg-chip" x="533" y="167" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(540 174) scale(0.8333)" d="M4 17a8 8 0 1 1 16 0 M12 17l3.5-4.5 M7 17h.01 M17 17h.01"/><text x="578" y="173" class="dg-t">Alias gpt-5-mini</text><text x="578" y="190" class="dg-s">Token limit per identity</text><text x="578" y="206" class="dg-s">429 with Retry-After</text></g><g class="tn-green"><rect class="dg-pill" x="522" y="244" width="53" height="22" rx="11"/><text x="548.5" y="259" class="dg-pill-t" text-anchor="middle">Usage</text></g><g class="tn-green"><rect class="dg-pill" x="581" y="244" width="46" height="22" rx="11"/><text x="604" y="259" class="dg-pill-t" text-anchor="middle">Logs</text></g><g class="tn-green"><rect class="dg-pill" x="633" y="244" width="66" height="22" rx="11"/><text x="666" y="259" class="dg-pill-t" text-anchor="middle">Budgets</text></g><g class="tn-amber"><path class="dg-line" d="M478 158 C500 158 496 92 518 92" marker-end="url(#ah)"/><path class="dg-flow" d="M478 158 C500 158 496 92 518 92"/></g><g class="tn-violet"><path class="dg-line" d="M641 128 V144" marker-end="url(#ah)"/></g><g class="tn-red"><path class="dg-dash" d="M520 196 C500 196 500 190 480 190" marker-end="url(#ah)"/></g><g class="tn-azure"><rect class="dg-zone" x="792" y="20" width="152" height="296" rx="16"/><path class="dg-ic" transform="translate(808 30) scale(0.6667)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="830" y="43" class="dg-cap">BACKEND</text></g><g class="tn-azure"><rect class="dg-box" x="802" y="148" width="132" height="72" rx="10"/><rect class="dg-chip" x="813" y="167" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(820 174) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="858" y="181" class="dg-t">Foundry</text><text x="858" y="198" class="dg-s">gpt-5-mini</text></g><g class="tn-azure"><path class="dg-line" d="M762 184 H798" marker-end="url(#ah)"/><path class="dg-flow" d="M762 184 H798"/></g><text x="32" y="348" class="dg-cap">WHAT EACH SIDE SEES</text><g class="tn-cyan"><rect class="dg-pill" x="32" y="360" width="220" height="22" rx="11"/><text x="142" y="375" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">model: aigw/gpt-5-mini</text></g><text x="142" y="400" class="dg-s" text-anchor="middle">Foundry name: connection/alias</text><g class="tn-violet"><rect class="dg-pill" x="316" y="360" width="220" height="22" rx="11"/><text x="426" y="375" class="dg-pill-t" text-anchor="middle">AI Gateway Models User</text></g><text x="426" y="400" class="dg-s" text-anchor="middle">on the default workspace</text><g class="tn-red"><rect class="dg-pill" x="600" y="360" width="220" height="22" rx="11"/><text x="710" y="375" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">rate_limit_exceeded</text></g><text x="710" y="400" class="dg-s" text-anchor="middle">gateway message inside</text><text x="16" y="424" class="dg-s">The project borrows the gateway's models: the platform team keeps the deployments, the keys, and the limits.</text>
</g></svg>
