description = "Assess and migrate supported APIM V2 configuration with local validation and individually approved az aigateway changes."

prompt = """
Follow `skills/migrate-ai-gateway/SKILL.md` and its bundled Python helper,
schemas, and capability catalog. Resolve the source service ID first. A
source-only invocation selects read-only feasibility assessment; do not require
a target, region, or provisioning approval. Require explicit destination
IDs/subscriptions only for destination-bound planning or execution, and a region
only for creation.

Check dependencies, the installed `az aigateway` contract, and the source service profile.
Only BasicV2, StandardV2, and PremiumV2 sources are initially enabled. V1 and
AIGateway source profiles are reserved. The source remains a
`Microsoft.ApiManagement/service`; the destination must use
`Microsoft.ApiManagement/aigateways`. Check installed new-RP dispatch support,
not just help. Never substitute legacy writes or pass the removed public
`--workspace-name` selector. Preserve legacy checkpoints read-only;
create a fresh version-4 workspace when destination-bound planning begins.
b22 supports model writes, workspace policies, telemetry exporters and post-create
networking; refresh evidence and approvals, using exposed arguments rather than
help mentions. Use reviewed explicit
alias and gateway key nodes, not an assumption that registrations are callable.
Follow the skill's references/model-workflow.md for Foundry import/sync,
approved Custom /models discovery, and operator-manifest fallback.
Use that reference's scoped selections for policies, network/connection intent,
telemetry, key lifecycle, MCP versions and multi-backend aliases. Keep exact
source behavior ownership and scope decisions; cost governance and payload
capture are opt-in. Do not enable mcp update --failure-mode, key rename,
unreviewed OpenTelemetry write fields or external provisioning. Existing policy,
network and lifecycle targets require verified foundations and fresh evidence;
endpoint credential reads need explicit approval.
For model discovery, use a protected runtime binding or the helper's separately
approved scoped APIM named-value/subscription-key read. The read-only listValue
and listSecrets actions use POST but do not mutate the source. Keep secrets in
process memory for the exact approved catalog endpoint/header; do not enumerate,
copy, log or expose their values. Do not categorically reject control-plane
secret retrieval when this supported path is available.

Collect source evidence through read-only ARM GETs. Collect non-secret destination
evidence only if a target is supplied and its reads are authorized.
Local APIOps/ARM evidence requires explicit path/content-digest
approval. Preserve gaps, conflicts, inheritance, provenance, and every behavior.

Inventory model-facing APIs, MCP tools, and required dependencies first.
Traditional APIs are not migration targets except as dependencies. Do not ask
about replacing the entire APIM instance. Honor any supplied AI subset; otherwise
ask about all discovered AI APIs versus a named subset only after inventory and
only when the choice affects assessment or planning.
Select concrete model IDs and finite supported operations. Never import wildcard
models, wildcard destination operations or all APIM operations automatically.
Keep catalogs source-only. Foundry import/sync compiles explicit add/update/verify
nodes, preserves existing policies and stale models by default, and proposes
removals separately. Do not execute native bulk sync as an opaque apply action.
For Foundry model planning, require authorized collect-sync-preview evidence
from the latest official, reviewed CLI and repeatable compile-plan
--sync-preview-file inputs. Native dry-run owns missing/stale decisions; only
selected create/unchanged registrations become granular TODOs. Create/verify
new providers in a foundation plan first. Alias-bound stale registrations can
block even preview: retain configuration and report the blocker, without a
substitute local diff. Custom discovery stays independent of native sync.

For assessment, analyze inventory and reviewed capabilities to give evidence-backed
outcomes: migratable, migratable with changes, not supported by this adapter, or
undetermined. Distinguish moving all assessed AI traffic from a feasible subset,
not full APIM replacement. Preserve broad inventory coverage and gaps. Determine
technical compatibility yourself; ask an actual focused question for essential
missing facts or scope decisions, not a generic confirmation checklist.

For requested executable planning, classify work as ready, needs-input, or
cannot-import and compile/validate the resource graph. Mappings own behaviors
once and may require multiple resource kinds/models. Initial needs-input mappings
are scaffolding, not feasibility findings. Missing coverage cannot be accepted away.

For requested execution, obtain per-item consequential approval against the
current plan digest. Execute
only helper-validated granular `az aigateway` templates. Never use legacy native
migration commands, source writes, destination REST writes, implicit replacement,
or unreviewed Foundry bulk/RBAC shortcuts. Keep secrets runtime-only.

Verify structural resource dependencies before dependent mutations, and verify
mapping-level source behavior across every required resource before completion.
Keep both verification stages distinct, stop dependents on failure,
and use protected atomic generations and drift checks on resume. Report complete,
accepted-residual, incomplete, blocked, failed, or cancelled work accurately.

Migration request: {{args}}
"""
