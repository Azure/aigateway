name: Refresh CLI surface snapshot

# `migrate-apim compile` checks the capability catalog against
# capabilities/cli-surface-<version>.json. That snapshot is only worth anything
# if it is an honest record of the released wheel, which is what this job
# establishes: install the pinned wheel, re-export the surface, and fail if what
# comes out differs from what is committed.
#
# It is the only part of the contract that needs an Azure CLI and a network, so
# it runs when the CLI changes -- on a cli-v* tag -- or when somebody asks.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      wheel-url:
        description: 'Wheel to export from. Defaults to the one the catalog pins.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install the Azure CLI
        run: |
          curl -fsSL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az version

      # The digest is checked before the wheel is installed, not after. An
      # unverified wheel is not something to run and then ask questions about.
      - name: Download and verify the pinned wheel
        id: wheel
        working-directory: tools/migrate-apim
        run: |
          set -euo pipefail
          CATALOG="$(ls capabilities/aigateway-*.json | head -1)"
          VERSION="$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['cliEvidence']['documentedVersion'])" "$CATALOG")"
          DIGEST="$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['cliEvidence']['wheelSha256'])" "$CATALOG")"
          WHEEL="aigateway-${VERSION}-py3-none-any.whl"
          URL="${{ inputs.wheel-url }}"
          if [ -z "$URL" ]; then
            URL="https://github.com/Azure/aigateway/releases/download/cli-v${VERSION}/${WHEEL}"
          fi
          echo "Fetching $URL"
          curl -fL --output "/tmp/${WHEEL}" "$URL"
          printf '%s  %s\n' "$DIGEST" "/tmp/${WHEEL}" | sha256sum --check
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "wheel=/tmp/${WHEEL}" >> "$GITHUB_OUTPUT"
          echo "catalog=$CATALOG" >> "$GITHUB_OUTPUT"

      # Into a directory of its own, so nothing here depends on, or disturbs,
      # whatever extensions the runner already has.
      - name: Install the extension in isolation
        run: |
          mkdir -p /tmp/aigw-ext /tmp/aigw-cfg
          AZURE_EXTENSION_DIR=/tmp/aigw-ext AZURE_CONFIG_DIR=/tmp/aigw-cfg \
            az extension add --source "${{ steps.wheel.outputs.wheel }}" --yes
          AZURE_EXTENSION_DIR=/tmp/aigw-ext AZURE_CONFIG_DIR=/tmp/aigw-cfg \
            az aigateway version -o json

      - name: Check the help parser still reads what it should
        working-directory: tools/migrate-apim
        env:
          AZURE_EXTENSION_DIR: /tmp/aigw-ext
          AZURE_CONFIG_DIR: /tmp/aigw-cfg
        run: python scripts/export_cli_surface.py --self-test

      - name: Re-export the surface
        working-directory: tools/migrate-apim
        env:
          AZURE_EXTENSION_DIR: /tmp/aigw-ext
          AZURE_CONFIG_DIR: /tmp/aigw-cfg
        run: |
          python scripts/export_cli_surface.py \
            --wheel "${{ steps.wheel.outputs.wheel }}" \
            --out "capabilities/cli-surface-${{ steps.wheel.outputs.version }}.json"

      - name: Compile against the freshly exported surface
        working-directory: tools/migrate-apim
        run: |
          pip install -e '.[dev]'
          python -m migrate_apim compile --cli-dir ../../cli

      # A difference here means the committed snapshot is not what the wheel
      # actually offers, so every offline compile since has been checking the
      # catalog against fiction. The regenerated file is attached so the fix is
      # a download and a commit.
      - name: Fail if the committed snapshot has drifted
        id: drift
        working-directory: tools/migrate-apim
        run: |
          if ! git diff --exit-code -- capabilities/; then
            echo "::error::The committed CLI surface snapshot does not match the pinned wheel."
            exit 1
          fi
          echo "Snapshot matches the pinned wheel."

      - if: failure() && steps.drift.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed-cli-surface
          path: tools/migrate-apim/capabilities/cli-surface-*.json
